# Каждый день собирает playlist.m3u заново и сохраняет его в репозиторий.
# 02:00 UTC = 05:00 по Москве. Запустить вручную: вкладка Actions → update → Run workflow.
name: update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_playlist.py
      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Обновить список каналов $(date -u +%F)"
          git push
